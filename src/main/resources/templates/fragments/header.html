<header th:fragment="header_fragment" style="background-color: #2c3e50; padding: 15px; color: white;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; gap: 15 px">
            <button id="toggleSidebarBtn">Menu</button>
            <a th:href="@{/}" style="color: white; text-decoration: none; font-size: 24px; font-weight: bold; margin-right: 20px;">
                VCPCS
            </a>
            <span th:if="${session.user != null}"
              th:text="'Xin chào, ' + ${session.user.fullName}">
            </span>
        </div>

        <div>
            <a th:if="${session.user == null}" th:href="@{/login}" style="background-color: white; color: black; padding: 6px 10px; text-decoration: none; font-size: 14px;">
                Login
            </a>
        </div>
    </div>
</header>
