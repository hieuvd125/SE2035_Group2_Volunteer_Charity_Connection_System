<header th:fragment="header_fragment" class="bg-dark text-white py-2 px-3 shadow-sm border-bottom border-secondary">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <button id="toggleSidebarBtn" class="btn btn-outline-light btn-sm">
                <i class="bi bi-list fs-5"></i>
            </button>
            <a th:href="@{/}" class="text-white text-decoration-none fw-bold fs-4 tracking-wide">
                VCPCS
            </a>
            <span th:if="${session.user != null}" class="badge bg-secondary bg-opacity-50 text-light fw-normal py-2 px-3 ms-2">
                <i class="bi bi-person-circle me-1"></i>
                Xin chào, <strong th:text="${session.user.fullName}">Tên người dùng</strong>
            </span>
        </div>

        <div>
            <a th:if="${session.user == null}" th:href="@{/login}" class="btn btn-light btn-sm fw-bold px-3">
                <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
            </a>
            <a th:if="${session.user != null}" th:href="@{/logout}" class="btn btn-danger btn-sm fw-bold px-3">
                <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
            </a>
        </div>
    </div>
</header>
