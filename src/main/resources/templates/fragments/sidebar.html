<div th:fragment="sidebar_fragment" id="sidebar" class="bg-white p-3 rounded shadow-sm border"
     style="width: 250px; min-width: 250px; height: fit-content; align-self: flex-start; position: sticky; top: 20px;">

    <h6 class="text-uppercase text-muted fw-bold mb-3 small">
        Điều Hướng
    </h6>

    <div class="list-group list-group-flush">
        <a th:if="${session.user == null}"
           th:href="@{/projects/homepage}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Trang Chủ Dự Án
        </a>
        <a th:if="${session.user == null}"
           th:href="@{/register/volunteer}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Đăng Ký Tình Nguyện
        </a>
        <a th:if="${session.user == null}"
           th:href="@{/register/organizer}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Đăng Ký Tổ Chức
        </a>
        <a th:if="${session.user != null and session.user.role == 'ORGANIZER'}"
           th:href="@{/organizer/projects/create}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Tạo dự án mới
        </a>
        <a th:if="${session.user != null and session.user.role == 'ORGANIZER'}"
           th:href="@{/organizer/projects}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Dự án của tôi
        </a>
        <a th:if="${session.user != null and session.user.role == 'ORGANIZER'}"
           th:href="@{/organizer/profile}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Trang cá nhân
        </a>

        <a th:if="${session.user != null and session.user.role == 'VOLUNTEER'}"
           th:href="@{/volunteer/attendance/submit}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Nộp minh chứng
        </a>
        <a th:if="${session.user != null and session.user.role == 'VOLUNTEER'}"
           th:href="@{/volunteer/my-activities}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Hoạt động của tôi
        </a>
        <a th:if="${session.user != null and session.user.role == 'VOLUNTEER'}"
           th:href="@{/saved-projects/my}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Dự án đã lưu
        </a>
        <a th:if="${session.user != null and session.user.role == 'VOLUNTEER'}"
           th:href="@{/volunteer/profile}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Trang cá nhân
        </a>

        <a th:if="${session.user != null and session.user.role == 'ADMIN'}"
           th:href="@{/admin/dashboard}" class="list-group-item list-group-item-action border-0 rounded mb-1 fw-bold text-primary bg-light">
            Dashboard Quản Trị
        </a>
        <a th:if="${session.user != null and session.user.role == 'ADMIN'}"
           th:href="@{/admin/projects/review}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Duyệt dự án
        </a>
        <a th:if="${session.user != null and session.user.role == 'ADMIN'}"
           th:href="@{/admin/users}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Quản lý tài khoản
        </a>
        <a th:if="${session.user != null and session.user.role == 'ADMIN'}"
           th:href="@{/admin/categories}" class="list-group-item list-group-item-action border-0 rounded mb-1">
            Quản lý Danh mục dự án
        </a>
    </div>
</div>
