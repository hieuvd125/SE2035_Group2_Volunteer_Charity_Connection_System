<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::body})}">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết dự án</title>
</head>
<body>
<div style="max-width: 800px; margin: 20px auto; font-family: Arial, sans-serif; line-height: 1.6;">
    <h2 th:text="${project.title}">Tên dự án</h2>
    <hr/>
    <p><strong>Mô tả:</strong> <span th:text="${project.description}">Mô tả</span></p>
    <p><strong>Địa điểm:</strong> <span th:text="${project.location}">Địa điểm</span></p>
    <p><strong>Ngày bắt đầu:</strong>
        <span th:text="${#temporals.format(project.startDate, 'dd/MM/yyyy')}"></span>
    </p>
    <p><strong>Ngày kết thúc:</strong>
        <span th:text="${#temporals.format(project.endDate, 'dd/MM/yyyy')}"></span>
    </p>
    <p><strong>Số lượng tình nguyện viên cần tuyển:</strong>
        <span th:text="${project.targetVolunteers}">0</span>
    </p>
    <p><strong>Số lượng ứng viên đã ứng tuyển:</strong>
        <span th:text="${applicantCount}">0</span>
    </p>
    <p><strong>Mục tiêu quyên góp:</strong>
        <span th:text="${project.targetDonation != null ? #numbers.formatDecimal(project.targetDonation, 0, 'POINT', 0, 'COMMA') + ' VNĐ' : '0 VNĐ'}">0 VNĐ</span>
    </p>
    <p><strong>Danh mục:</strong>
        <span th:text="${project.category != null ? project.category.name : 'Không có'}"></span>
    </p>
    <p><strong>Người đăng:</strong>
        <span th:text="${project.organizer != null ? project.organizer.fullName : 'Không rõ'}"></span>
    </p>
    <p><strong>Trạng thái:</strong> <span th:text="${project.status}"></span></p>

    <div th:if="${message}" th:text="${message}"></div>
    <div th:if="${error}" th:text="${error}"></div>

    <form th:if="${project.status == 'RECRUITING'}"
          th:action="@{/organizer/projects/{id}/close_recruitment(id=${project.id})}"
          method="post" style="display:inline">
        <button type="submit">Đóng ứng tuyển</button>
    </form>
    <form th:if="${project.status == 'RECRUITMENT_CLOSED'}"
          th:action="@{/organizer/projects/{id}/start_project(id=${project.id})}"
          method="post" style="display:inline">
        <button type="submit">Tiến hành dự án</button>
    </form>
    <a th:href="@{/organizer/projects/{id}/edit(id=${project.id})}">Update</a>

    <a th:href="@{/organizer/projects/{id}/registrations(id=${project.id})}">Xem danh sách ứng viên</a>
    <a th:href="@{/organizer/projects}">Quay lại danh sách</a>
</div>
</body>
</html>
