<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::body})}">
<head>
    <meta charset="UTF-8">
    <title>Danh sách dự án của tôi</title>
</head>
<body>
<h2>Danh sách dự án của tôi</h2>

<form method="get" th:action="@{/organizer/projects}">
    <input type="text" name="title" placeholder="Tìm theo tên" th:value="${filterTitle}"/>
    <input type="text" name="location" placeholder="Tìm theo địa điểm" th:value="${filterLocation}"/>
    <select name="status">
        <option value="">Tất cả trạng thái</option>
        <option value="PENDING"    th:selected="${filterStatus == 'PENDING'}">Chờ duyệt</option>
        <option value="PLANNING"   th:selected="${filterStatus == 'PLANNING'}">Đang kế hoạch</option>
        <option value="RECRUITING" th:selected="${filterStatus == 'RECRUITING'}">Đang tuyển</option>
        <option value="RECRUITMENT_CLOSED" th:selected="${filterStatus == 'RECRUITMENT_CLOSED'}">Đã đóng ứng tuyển</option>
        <option value="ONGOING"    th:selected="${filterStatus == 'ONGOING'}">Đang tiến hành</option>
        <option value="REJECTED"   th:selected="${filterStatus == 'REJECTED'}">Từ chối</option>
        <option value="COMPLETED"  th:selected="${filterStatus == 'COMPLETED'}">Đã hoàn thành</option>
    </select>

    <button type="submit">Tìm kiếm</button>
    <a th:href="@{/organizer/projects}">Clear</a>
</form>

<div th:if="${projects != null and not #lists.isEmpty(projects)}">
    <table>
        <tr>
            <th>ID</th>
            <th>Tên chiến dịch</th>
            <th>Địa điểm</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
        <tr th:each="p : ${projects}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.title}"></td>
            <td th:text="${p.location}"></td>
            <td th:text="${p.status}"></td>
            <td><a th:href="@{/organizer/projects/{id}(id=${p.id})}">Xem chi tiết</a></td>
        </tr>
    </table>

    <div class="pagination" th:if="${totalPage > 1}" aria-label="Phân trang">
        <a th:if="${currentPage > 0}"
           th:href="@{/organizer/projects(pageNumber=${currentPage - 1}, title=${filterTitle}, location=${filterLocation}, status=${filterStatus})}">Trước</a>
        <span th:if="${currentPage == 0}">Trước</span>
        <a th:each="i : ${#numbers.sequence(0, totalPage - 1)}"
           th:href="@{/organizer/projects(pageNumber=${i}, title=${filterTitle}, location=${filterLocation}, status=${filterStatus})}"
           th:text="${i + 1}"
           th:classappend="${i == currentPage} ? 'active' : ''"></a>
        <a th:if="${currentPage < totalPage - 1}"
           th:href="@{/organizer/projects(pageNumber=${currentPage + 1}, title=${filterTitle}, location=${filterLocation}, status=${filterStatus})}">Sau</a>
        <span th:if="${currentPage >= totalPage - 1}">Sau</span>
        <span class="summary">Trang <b th:text="${currentPage + 1}"></b>/<b th:text="${totalPage}"></b></span>
    </div>
</div>

<div th:if="${projects == null or #lists.isEmpty(projects)}">
    <p>Không có dự án nào.</p>
</div>
</body>
</html>
