<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::body})}">
<head>
    <title>Nop minh chung tham gia</title>
</head>
<body>
<h1>Nop minh chung tham gia tinh nguyen</h1>

<p th:if="${message}" th:text="${message}"></p>

<p th:if="${#lists.isEmpty(registrations)}">Ban chua co don dang ky nao de nop minh chung.</p>

<form th:if="${!#lists.isEmpty(registrations)}" th:action="@{/attendance/submit}" method="post">
    <div>
        <label for="registrationId">Chon don dang ky</label>
        <select id="registrationId" name="registrationId" required>
            <option th:each="registration : ${registrations}"
                    th:value="${registration.id}"
                    th:text="${'Don #' + registration.id + ' - Du an: ' + registration.project.title + ' - Trang thai: ' + registration.status}">
            </option>
        </select>
    </div>

    <div>
        <label for="reportText">Bao cao sau su kien</label><br>
        <textarea id="reportText" name="reportText" rows="6" cols="70"
                  placeholder="Nhap noi dung bao cao, cong viec da tham gia, ket qua ho tro..."></textarea>
    </div>

    <div>
        <label for="proofImage">Duong dan anh minh chung</label>
        <input id="proofImage" type="text" name="proofImage" placeholder="Vi du: https://.../anh-minh-chung.jpg">
    </div>

    <button type="submit">Nop minh chung</button>
</form>
</body>
</html>
