<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::body})}">
<head>
    <title>Nộp minh chứng tham gia</title>
</head>
<body>
<h1>Nộp minh chứng tham gia tình nguyện</h1>

<p th:if="${message}" th:text="${message}"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<p th:if="${#lists.isEmpty(registrations)}">Bạn chưa có dự án đã hoàn thành để nộp minh chứng.</p>

<form th:if="${!#lists.isEmpty(registrations)}" th:action="@{/volunteer/attendance/submit}"
      method="post" enctype="multipart/form-data">
    <div>
        <label for="registrationId">Chọn dự án đã hoàn thành</label>
        <select id="registrationId" name="registrationId" required>
            <option th:each="registration : ${registrations}"
                    th:value="${registration.id}"
                    th:text="${registration.project.title + ' - Trạng thái tham gia: ' + registration.status}">
            </option>
        </select>
    </div>

    <div>
        <label for="reportText">Báo cáo sau sự kiện</label><br>
        <textarea id="reportText" name="reportText" rows="6" cols="70"
                  placeholder="Nhập nội dung báo cáo, công việc đã tham gia, kết quả hỗ trợ..."
                  required></textarea>
    </div>

    <div>
        <label for="proofImage">Ảnh minh chứng</label>
        <input id="proofImage" type="file" name="proofImage" accept="image/*" required>
    </div>

    <button type="submit">Nộp minh chứng</button>
</form>
</body>
</html>
