<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký Tổ chức</title>
</head>
<header style="background-color: #2c3e50; padding: 15px; color: white;">
    <a th:href="@{/}" style="color: white; text-decoration: none; font-size: 24px; font-weight: bold; margin-right: 20px;">
        VCPCS
    </a>
</header>
<body>
<div>
    <h2 style="margin-top:0; text-align: center; color: #2c3e50;">Đăng ký Tài khoản Tổ chức</h2>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>

    <form th:action="@{/register/organizer}" th:object="${registerRequest}" method="POST">

        <div class="form-group">
            <label>Tên đăng nhập: </label>
            <input type="text" th:field="*{username}" required>
            <span class="error-message" th:errors="*{username}"></span>
        </div>

        <div class="form-group">
            <label>Tên tổ chức / Đơn vị: </label>
            <input type="text" th:field="*{fullName}" required>
            <span class="error-message" th:errors="*{fullName}"></span>
        </div>

        <div class="form-group">
            <label>Email liên hệ: </label>
            <input type="email" th:field="*{email}" required>
            <span class="error-message" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label>Mật khẩu: </label>
            <input type="password" th:field="*{password}" required>
            <span class="error-message" th:errors="*{password}"></span>
        </div>

        <div class="form-group">
            <label>Số điện thoại liên hệ: </label>
            <input type="text" th:field="*{phoneNumber}">
            <span class="error-message" th:errors="*{phoneNumber}"></span>
        </div>

        <div class="form-group">
            <label>Tỉnh / Thành phố: </label>
            <input type="text" th:field="*{city}">
            <span class="error-message" th:errors="*{city}"></span>
        </div>

        <div class="form-group">
            <label>Địa chỉ trụ sở: </label>
            <input type="text" th:field="*{address}">
            <span class="error-message" th:errors="*{address}"></span>
        </div>

        <div class="form-group">
            <label>Website / Trang thông tin: </label>
            <input type="url" th:field="*{website}" placeholder="https://example.org">
            <span class="error-message" th:errors="*{website}"></span>
        </div>

        <div class="form-group">
            <label>Mô tả ngắn về tổ chức: </label>
            <textarea th:field="*{description}" rows="3"></textarea>
            <span class="error-message" th:errors="*{description}"></span>
        </div>

        <button type="submit" class="btn-reg">Gửi đơn đăng ký</button>
    </form>
    <div>Đã có tài khoản? <a th:href="@{/login}" class="back-link">Đăng nhập tại đây</a></div>
</div>
</body>
</html>
