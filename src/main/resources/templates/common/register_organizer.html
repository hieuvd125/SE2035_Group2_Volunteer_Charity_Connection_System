<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký Tổ chức</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- BỘ CSS NÀY BẢO ĐẢM CĂN GIỮA TUYỆT ĐỐI NẰM NGAY TRONG TRANG -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        }

        /* Khung chứa dùng Flexbox để ép Form luôn lọt vào giữa màn hình */
        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        /* Thẻ Card trắng bao quanh form */
        .auth-card {
            width: 100%;
            max-width: 580px;
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        /* Ép tất cả các ô nhập liệu giãn đủ 100% khung form */
        .auth-card input[type="text"],
        .auth-card input[type="password"],
        .auth-card input[type="email"],
        .auth-card input[type="url"],
        .auth-card select,
        .auth-card textarea {
            width: 100% !important;
            padding: 10px 14px !important;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-top: 4px;
            margin-bottom: 14px;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        .auth-card input:focus,
        .auth-card textarea:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .auth-card label {
            font-weight: 600;
            color: #334155;
            font-size: 14px;
            display: block;
        }

        .auth-card .btn-submit {
            width: 100%;
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .auth-card .btn-submit:hover {
            background-color: #0b5ed7;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            display: block;
            margin-top: -10px;
            margin-bottom: 10px;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>
<body>

<!-- Header đã được chuyển vào đúng bên trong body -->
<header style="background-color: #2c3e50; padding: 15px 30px; color: white;">
    <a th:href="@{/}" style="color: white; text-decoration: none; font-size: 24px; font-weight: bold;">
        VCPCS
    </a>
</header>

<!-- Khung bao bọc Flexbox căn giữa -->
<div class="auth-wrapper">
    <div class="auth-card">

        <h2 style="margin-top: 0; text-align: center; color: #1e293b; margin-bottom: 24px; font-size: 22px;">
            Đăng ký Tài khoản Tổ chức
        </h2>

        <!-- Thông báo lỗi từ Backend (nếu có) -->
        <p th:if="${errorMessage}" th:text="${errorMessage}"
           style="background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; padding: 10px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 15px;"></p>

        <form th:action="@{/register/organizer}" th:object="${registerRequest}" method="POST">

            <div>
                <label>Tên đăng nhập <span style="color: red;">*</span></label>
                <input type="text" th:field="*{username}" required placeholder="Nhập tên đăng nhập">
                <span class="error-message" th:errors="*{username}"></span>
            </div>

            <div>
                <label>Tên tổ chức / Đơn vị <span style="color: red;">*</span></label>
                <input type="text" th:field="*{fullName}" required placeholder="Tên chính thức của tổ chức">
                <span class="error-message" th:errors="*{fullName}"></span>
            </div>

            <div>
                <label>Email liên hệ <span style="color: red;">*</span></label>
                <input type="email" th:field="*{email}" required placeholder="example@org.vn">
                <span class="error-message" th:errors="*{email}"></span>
            </div>

            <div>
                <label>Mật khẩu <span style="color: red;">*</span></label>
                <input type="password" th:field="*{password}" required placeholder="••••••••">
                <span class="error-message" th:errors="*{password}"></span>
            </div>

            <div>
                <label>Số điện thoại liên hệ</label>
                <input type="text" th:field="*{phoneNumber}" placeholder="0901234567">
                <span class="error-message" th:errors="*{phoneNumber}"></span>
            </div>

            <div>
                <label>Tỉnh / Thành phố</label>
                <input type="text" th:field="*{city}" placeholder="Hà Nội, TP.HCM,...">
                <span class="error-message" th:errors="*{city}"></span>
            </div>

            <div>
                <label>Địa chỉ trụ sở</label>
                <input type="text" th:field="*{address}" placeholder="Số nhà, tên đường, quận/huyện...">
                <span class="error-message" th:errors="*{address}"></span>
            </div>

            <div>
                <label>Website / Trang thông tin</label>
                <input type="url" th:field="*{website}" placeholder="https://example.org">
                <span class="error-message" th:errors="*{website}"></span>
            </div>

            <div>
                <label>Mô tả ngắn về tổ chức</label>
                <textarea th:field="*{description}" rows="3" placeholder="Giới thiệu sơ lược về chức năng, sứ mệnh của tổ chức..."></textarea>
                <span class="error-message" th:errors="*{description}"></span>
            </div>

            <button type="submit" class="btn-submit">Gửi đơn đăng ký</button>
        </form>

        <div class="login-footer">
            Đã có tài khoản? <a th:href="@{/login}" style="color: #0d6efd; text-decoration: none; font-weight: 600;">Đăng nhập tại đây</a>
        </div>

    </div>
</div>

</body>
</html>
