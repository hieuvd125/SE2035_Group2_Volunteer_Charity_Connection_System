<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký Tình nguyện viên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- BỘ CSS CĂN GIỮA MÀN HÌNH VÀ TỐI ƯU FORM -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        }

        /* Khung Flexbox ép Form luôn vào chính giữa màn hình */
        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        /* Thẻ Card trắng bao quanh form */
        .auth-card {
            width: 100%;
            max-width: 580px;
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        /* Kéo giãn tất cả ô nhập liệu, dropdown và textarea đủ 100% khung */
        .auth-card input[type="text"],
        .auth-card input[type="password"],
        .auth-card input[type="email"],
        .auth-card input[type="date"],
        .auth-card select,
        .auth-card textarea {
            width: 100% !important;
            padding: 10px 14px !important;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-top: 4px;
            margin-bottom: 14px;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        .auth-card input:focus,
        .auth-card select:focus,
        .auth-card textarea:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .auth-card label {
            font-weight: 600;
            color: #334155;
            font-size: 14px;
            display: block;
        }

        .auth-card .btn-submit {
            width: 100%;
            background-color: #198754; /* Màu xanh lá thân thiện cho TNV */
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .auth-card .btn-submit:hover {
            background-color: #157347;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            display: block;
            margin-top: -10px;
            margin-bottom: 10px;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>
<body>

<!-- Header đặt đúng vị trí bên trong body -->
<header style="background-color: #2c3e50; padding: 15px 30px; color: white;">
    <a th:href="@{/}" style="color: white; text-decoration: none; font-size: 24px; font-weight: bold;">
        VCPCS
    </a>
</header>

<!-- Khung bao bọc Flexbox căn giữa màn hình -->
<div class="auth-wrapper">
    <div class="auth-card">

        <h2 style="margin-top: 0; text-align: center; color: #1e293b; margin-bottom: 24px; font-size: 22px;">
            Đăng ký Tình nguyện viên
        </h2>

        <!-- Thông báo lỗi hệ thống (nếu có) -->
        <p th:if="${errorMessage}" th:text="${errorMessage}"
           style="background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; padding: 10px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 15px;"></p>

        <form th:action="@{/register/volunteer}" th:object="${registerRequest}" method="POST">

            <div>
                <label>Tên đăng nhập <span style="color: red;">*</span></label>
                <input type="text" th:field="*{username}" required placeholder="Nhập tên đăng nhập">
                <span class="error-message" th:errors="*{username}"></span>
            </div>

            <div>
                <label>Họ và tên <span style="color: red;">*</span></label>
                <input type="text" th:field="*{fullName}" required placeholder="Nguyễn Văn A">
                <span class="error-message" th:errors="*{fullName}"></span>
            </div>

            <div>
                <label>Email <span style="color: red;">*</span></label>
                <input type="email" th:field="*{email}" required placeholder="example@gmail.com">
                <span class="error-message" th:errors="*{email}"></span>
            </div>

            <div>
                <label>Mật khẩu <span style="color: red;">*</span></label>
                <input type="password" th:field="*{password}" required placeholder="••••••••">
                <span class="error-message" th:errors="*{password}"></span>
            </div>

            <div>
                <label>Số điện thoại</label>
                <input type="text" th:field="*{phoneNumber}" placeholder="0901234567">
                <span class="error-message" th:errors="*{phoneNumber}"></span>
            </div>

            <div>
                <label>Tỉnh / Thành phố</label>
                <input type="text" th:field="*{city}" placeholder="Hà Nội, TP.HCM,...">
                <span class="error-message" th:errors="*{city}"></span>
            </div>

            <div>
                <label>Địa chỉ cụ thể</label>
                <input type="text" th:field="*{address}" placeholder="Số nhà, đường, phường/xã...">
                <span class="error-message" th:errors="*{address}"></span>
            </div>

            <div>
                <label>Ngày sinh</label>
                <input type="date" th:field="*{dateOfBirth}">
                <span class="error-message" th:errors="*{dateOfBirth}"></span>
            </div>

            <div>
                <label>Giới tính</label>
                <select th:field="*{gender}">
                    <option value="">-- Chọn giới tính --</option>
                    <option value="MALE">Nam</option>
                    <option value="FEMALE">Nữ</option>
                    <option value="OTHER">Khác</option>
                </select>
                <span class="error-message" th:errors="*{gender}"></span>
            </div>

            <div>
                <label>Giới thiệu bản thân / Kỹ năng</label>
                <textarea th:field="*{bio}" rows="3" placeholder="Chia sẻ kinh nghiệm tình nguyện hoặc kỹ năng cá nhân của bạn..."></textarea>
                <span class="error-message" th:errors="*{bio}"></span>
            </div>

            <button type="submit" class="btn-submit">Đăng ký ngay</button>
        </form>

        <div class="login-footer">
            Đã có tài khoản? <a th:href="@{/login}" style="color: #0d6efd; text-decoration: none; font-weight: 600;">Đăng nhập tại đây</a>
        </div>

    </div>
</div>

</body>
</html>
