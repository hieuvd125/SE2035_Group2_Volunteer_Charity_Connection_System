<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký Tình nguyện viên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<header style="background-color: #2c3e50; padding: 15px; color: white;">
    <a th:href="@{/}" style="color: white; text-decoration: none; font-size: 24px; font-weight: bold; margin-right: 20px;">
        VCPCS
    </a>
</header>
<body>
<div>
    <h2 style="margin-top:0; text-align: center; color: #2c3e50;">Đăng ký Tình nguyện viên</h2>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>

    <form th:action="@{/register/volunteer}" th:object="${registerRequest}" method="POST">

        <div class="form-group">
            <label>Tên đăng nhập: </label>
            <input type="text" th:field="*{username}" required>
            <span class="error-message" th:errors="*{username}"></span>
        </div>

        <div class="form-group">
            <label>Họ và tên: </label>
            <input type="text" th:field="*{fullName}" required>
            <span class="error-message" th:errors="*{fullName}"></span>
        </div>

        <div class="form-group">
            <label>Email: </label>
            <input type="email" th:field="*{email}" required>
            <span class="error-message" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label>Mật khẩu: </label>
            <input type="password" th:field="*{password}" required>
            <span class="error-message" th:errors="*{password}"></span>
        </div>

        <div class="form-group">
            <label>Số điện thoại: </label>
            <input type="text" th:field="*{phoneNumber}">
            <span class="error-message" th:errors="*{phoneNumber}"></span>
        </div>

        <div class="form-group">
            <label>Tỉnh / Thành phố: </label>
            <input type="text" th:field="*{city}">
            <span class="error-message" th:errors="*{city}"></span>
        </div>

        <div class="form-group">
            <label>Địa chỉ cụ thể: </label>
            <input type="text" th:field="*{address}">
            <span class="error-message" th:errors="*{address}"></span>
        </div>

        <div class="form-group">
            <label>Ngày sinh: </label>
            <input type="date" th:field="*{dateOfBirth}">
            <span class="error-message" th:errors="*{dateOfBirth}"></span>
        </div>

        <div class="form-group">
            <label>Giới tính: </label>
            <select th:field="*{gender}">
                <option value="">-- Chọn giới tính --</option>
                <option value="MALE">Nam</option>
                <option value="FEMALE">Nữ</option>
                <option value="OTHER">Khác</option>
            </select>
            <span class="error-message" th:errors="*{gender}"></span>
        </div>

        <div class="form-group">
            <label>Giới thiệu bản thân / Kỹ năng: </label>
            <textarea th:field="*{bio}" rows="3"></textarea>
            <span class="error-message" th:errors="*{bio}"></span>
        </div>

        <button type="submit" class="btn-reg">Đăng ký ngay</button>
    </form>
    <div>Đã có tài khoản? <a th:href="@{/login}" class="back-link">Đăng nhập tại đây</a></div>
</div>
</body>
</html>
