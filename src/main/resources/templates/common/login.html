<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<header style="background-color: #2c3e50; padding: 15px; color: white;">
    <a th:href="@{/}" style="color: white; text-decoration: none; font-size: 24px; font-weight: bold; margin-right: 20px;">
        VCPCS
    </a>
</header>
<body>
    <h2>VCPCS Login</h2>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>
    <form th:action="@{/login}" method="POST">
        <div style="display: flex; flex-direction: column">
            <div>
                <label>Email: </label>
                <input type="text" name="email" required>
            </div>
            <div>
                <label>Mật khẩu: </label>
                <input type="password" name="password" placeholder="********" required>
            </div>
            <div>
                <button type="submit">Login</button>
            </div>
        </div>
    </form>
</body>
</html>
