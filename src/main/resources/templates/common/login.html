<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<header style="background-color: #2c3e50; padding: 15px; color: white;">
    <a th:href="@{/}" style="color: white; text-decoration: none; font-size: 24px; font-weight: bold; margin-right: 20px;">
        VCPCS
    </a>
</header>
<body>
    <h2 style="margin-top:0; text-align: center; color: #2c3e50;">VCPCS Đăng nhập</h2>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>
    <p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold;"></p>
    <form th:action="@{/login}" style="display: flex; justify-content: center;" method="POST">
        <div style="display: flex; flex-direction: column">
            <div>
                <label>Username: </label>
                <input type="text" name="username" required>
            </div>
            <div>
                <label>Mật khẩu: </label>
                <input type="password" name="password" placeholder="********" required>
            </div>
            <div>
                <button type="submit">Login</button>
            </div>
        </div>
    </form>
    <div style="margin-top: 15px; text-align: center;">
        <p>Chưa có tài khoản? Đăng ký ngay:</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <a th:href="@{/register/volunteer}" class="btn-link">Tài khoản Tình nguyện viên</a>
            <span>|</span>
            <a th:href="@{/register/organizer}" class="btn-link">Tài khoản Tổ chức / NGO</a>
        </div>
    </div>
</body>
</html>
