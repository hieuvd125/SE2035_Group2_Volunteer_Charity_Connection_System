<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<header style="background-color: #2c3e50; padding: 15px; color: white;">
    <a th:href="@{/}" style="color: white; text-decoration: none; font-size: 24px; font-weight: bold; margin-right: 20px;">
        VCPCS
    </a>
</header>
<body>
    <h2 style="margin-top:0; text-align: center; color: #2c3e50;">VCPCS Đăng nhập</h2>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>
    <p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold;"></p>
    <form th:action="@{/login}" method="POST">
        <div style="display: flex; flex-direction: column">
            <div>
                <label>Email: </label>
                <input type="text" name="email" required>
            </div>
            <div>
                <label>Mật khẩu: </label>
                <input type="password" name="password" placeholder="********" required>
            </div>
            <div>
                <button type="submit">Login</button>
            </div>
        </div>
    </form>
    <div>Không có tài khoản?<a th:href="@{/register}" class="register-link">Đăng ký tài khoản </a></div>
</body>
</html>
