<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::#donation-list-content})}">
<head>
    <title>Danh Sách Nhà Hảo Tâm - VCPCS</title>
</head>
<body>
<div id="donation-list-content" class="container py-4">
    <h3 class="text-primary mb-3">Danh Sách Nhà Hảo Tâm Quyên Góp</h3>
    <h5 class="text-muted mb-4" th:text="'Dự án: ' + ${project.title}">Tên dự án</h5>

    <div class="alert alert-success py-2 fs-5">
        <strong>Tổng số tiền quyên góp được: </strong>
        <span class="text-danger fw-bold fs-4" th:text="${#numbers.formatDecimal(total, 0, 'POINT', 0, 'COMMA')}">0</span> VNĐ
    </div>

    <div th:if="${#lists.isEmpty(list)}" class="alert alert-secondary mt-3">
        Chưa có lượt quyên góp nào cho dự án này.
    </div>

    <table th:if="${!#lists.isEmpty(list)}" class="table table-striped table-bordered mt-3">
        <thead class="table-dark">
        <tr>
            <th>Nhà hảo tâm</th>
            <th>Số tiền</th>
            <th>Thời gian</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${list}">
            <td th:text="${d.donorName}">Tên hiển thị</td>

            <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(d.amount, 0, 'POINT', 0, 'COMMA')} + ' VNĐ'">0 VNĐ</td>

            <td th:text="${#temporals.format(d.donatedAt, 'dd/MM/yyyy HH:mm')}">Thời gian</td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/projects/detail/{id}(id=${project.id})}" class="btn btn-secondary mt-3">Quay lại chi tiết dự án</a>
</div>
</body>
</html>
