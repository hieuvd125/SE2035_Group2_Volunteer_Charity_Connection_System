<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::#donation-list-content})}">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Nhà Hảo Tâm - VCPCS</title>

    <style>
        .donation-card {
            max-width: 850px;
        }
        .project-subtitle {
            color: #64748b;
            font-size: 15px;
            margin-top: -15px;
            margin-bottom: 20px;
        }
        .total-summary-box {
            background-color: #d1e7dd;
            border: 1px solid #badbcc;
            color: #0f5132;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-amount {
            color: #dc3545;
            font-size: 20px;
            font-weight: 700;
        }
        .empty-donation-alert {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            color: #6c757d;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .amount-highlight {
            color: #198754;
            font-weight: 700;
        }
        .col-width-fixed {
            width: 200px;
        }
    </style>
</head>
<body>

<div id="donation-list-content" class="container py-3">

    <div class="detail-card donation-card">

        <h2 class="card-title">Danh Sách Nhà Hảo Tâm Quyên Góp</h2>
        <p class="project-subtitle" th:text="'Dự án: ' + ${project.title}">Tên dự án</p>

        <div class="total-summary-box">
            <span><strong>Tổng số tiền quyên góp được:</strong></span>
            <span class="total-amount">
                <span th:text="${#numbers.formatDecimal(total, 0, 'POINT', 0, 'COMMA')}">0</span> VNĐ
            </span>
        </div>

        <div th:if="${#lists.isEmpty(list)}" class="empty-donation-alert">
            Chưa có lượt quyên góp nào cho dự án này.
        </div>

        <table th:if="${!#lists.isEmpty(list)}">
            <thead>
            <tr>
                <th>Nhà hảo tâm</th>
                <th class="col-width-fixed">Số tiền</th>
                <th class="col-width-fixed">Thời gian</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${list}">
                <td><strong th:text="${d.donorName}">Tên hiển thị</strong></td>
                <td class="amount-highlight" th:text="${#numbers.formatDecimal(d.amount, 0, 'POINT', 0, 'COMMA')} + ' VNĐ'">0 VNĐ</td>
                <td th:text="${#temporals.format(d.donatedAt, 'dd/MM/yyyy HH:mm')}">Thời gian</td>
            </tr>
            </tbody>
        </table>

        <div class="btn-group-custom">
            <a th:href="@{/projects/detail/{id}(id=${project.id})}" class="btn-back">
                ← Quay lại chi tiết dự án
            </a>
        </div>

    </div>

</div>

</body>
</html>
