<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::#project-content})}">
<head>
    <title>Chi Tiết Dự Án</title>
</head>
<body>

<div id="project-content" class="container-fluid">
    <div class="row p-4 d-flex justify-content-center">
        <div class="col-md-8 card p-4 shadow-sm">
            <h2 class="text-primary mb-3" th:text="${project.title}">Tên Dự Án</h2>
            <p class="mt-3 text-muted"
               th:text="${project.description}">
            </p>
            <hr>
            <p><strong>Khu vực:</strong> <span th:text="${project.location}">Địa điểm</span></p>

            <p><strong>Lĩnh vực:</strong>
                <span th:text="${project.category?.name != null ? project.category.name : 'Chưa phân loại'}"></span>
            </p>

            <p><strong>Ngày bắt đầu:</strong> <span th:text="${#temporals.format(project.startDate,'dd/MM/yyyy')}"></span></p>
            <p><strong>Ngày kết thúc:</strong> <span th:text="${#temporals.format(project.endDate,'dd/MM/yyyy')}"></span></p>
            <p><strong>Đơn vị tổ chức:</strong> <span th:text="${project.organizer?.fullName != null ? project.organizer.fullName : 'Chưa cập nhật'}"></span></p>
            <p><strong>Số lượng TNV mục tiêu:</strong> <span th:text="${project.targetVolunteers}">0</span> người</p>
            <p><strong>Đã tuyển:</strong> <span th:text="${approvedCount}"></span> người</p>
            <p><strong>Còn trống:</strong><span class="text-success fw-bold" th:text="${remainingSlot}"></span>chỗ</p>
            <div class="mt-3 p-3 bg-light rounded border" th:if="${project.targetDonation != null and project.targetDonation > 0}">
                <h6 class="text-secondary font-weight-bold mb-2">
                    <i class="bi bi-cash-coin me-2 text-warning"></i>Tiến độ gây quỹ ủng hộ
                </h6>
                <div class="d-flex justify-content-between mb-1 small text-muted">
                    <span>Đã nhận: <strong class="text-primary" th:text="${#numbers.formatDecimal(currentDonated, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</strong></span>
                    <span>Mục tiêu: <strong th:text="${#numbers.formatDecimal(project.targetDonation, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</strong></span>
                </div>
                <!-- Thanh Progress Bar động của Bootstrap -->
                <div class="progress" style="height: 15px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning text-dark font-weight-bold"
                         role="progressbar"
                         th:style="'width: ' + ${percentProgress} + '%'"
                         th:aria-valuenow="${percentProgress}"
                         aria-valuemin="0"
                         aria-valuemax="100"
                         th:text="${#numbers.formatDecimal(percentProgress, 1, 1)} + '%'">
                        0%
                    </div>
                </div>
            </div>
            <p><strong>Trạng thái:</strong>
                <span
                        class="badge"
                        th:classappend="${project.status == 'RECRUITING'} ? 'bg-success' : 'bg-warning text-dark'"
                        th:text="${project.status}">
                </span>
            </p>
            <p class="text-danger" th:if="${errorMessage}" th:text="${errorMessage}"></p>
            <div style="color: green" class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>



            <form th:action="@{/projects/apply}" method="post" class="mt-4">
                <input type="hidden" name="projectId" th:value="${project.id}"/>
                <button type="submit" class="btn btn-success btn-lg px-5" th:if="${project.status == 'RECRUITING' and !applied}">
                    Đăng Ký Tham Gia
                </button>

                <button type="button" class="btn btn-info btn-lg px-5 text-white" disabled th:if="${project.status == 'RECRUITING' and applied}">
                    <i class="bi bi-check-circle me-2"></i>Bạn đã nộp đơn (Chờ duyệt)
                </button>

                <button
                        type="button"
                        class="btn btn-secondary btn-lg px-5"
                        disabled
                        th:if="${project.status != 'RECRUITING'}">

                    Không thể đăng ký
                </button>

                <a th:href="@{/projects/homepage}" class="btn btn-secondary btn-lg px-4 ms-2">Quay lại trang chủ</a>
            </form>

            <div class="mt-4 pt-3 border-top d-flex gap-2">

                <a th:href="@{/donations/form(projectId=${project.id})}" class="btn btn-warning btn-lg text-dark fw-bold">
                    <i class="bi bi-heart-fill me-2 text-danger"></i>Quyên Góp Ủng Hộ
                </a>

            <br>
                <a th:href="@{/donations/list(projectId=${project.id})}" class="btn btn-outline-success btn-lg">
                    <i class="bi bi-list-stars me-2"></i>Xem Danh Sách Nhà Hảo Tâm
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
