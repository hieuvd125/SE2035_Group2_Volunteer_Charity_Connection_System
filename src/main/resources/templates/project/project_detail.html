<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::#project-content})}">
<head>
    <title>Chi Tiết Dự Án</title>
</head>
<body>

<div id="project-content" class="container-fluid">
    <div class="row p-4 d-flex justify-content-center">
        <div class="col-md-8 card p-4 shadow-sm">
            <h2 class="text-primary mb-3" th:text="${project.title}">Tên Dự Án</h2>
            <p class="mt-3 text-muted"
               th:text="${project.description}">
            </p>
            <hr>
            <p><strong>Khu vực:</strong> <span th:text="${project.location}">Địa điểm</span></p>
            <p><strong>Lĩnh vực:</strong> <span th:text="${project.category.name}"></span></p>
            <p><strong>Ngày bắt đầu:</strong> <span th:text="${#temporals.format(project.startDate,'dd/MM/yyyy')}"></span></p>
            <p><strong>Ngày kết thúc:</strong> <span th:text="${#temporals.format(project.endDate,'dd/MM/yyyy')}"></span></p>
            <p><strong>Đơn vị tổ chức:</strong> <span th:text="${project.organizer?.fullName != null ? project.organizer.fullName : 'Chưa cập nhật'}"></span></p>
            <p><strong>Số lượng TNV mục tiêu:</strong> <span th:text="${project.targetVolunteers}">0</span> người</p>
            <p><strong>Đã tuyển:</strong> <span th:text="${approvedCount}"></span> người</p>
            <p><strong>Còn trống:</strong><span class="text-success fw-bold" th:text="${remainingSlot}"></span>chỗ</p>
            <p><strong>Trạng thái:</strong>
                <span
                        class="badge"
                        th:classappend="${project.status == 'RECRUITING'} ? 'bg-success' : 'bg-warning text-dark'"
                        th:text="${project.status}">
                </span>
            </p>
            <p class="text-danger" th:if="${errorMessage}" th:text="${errorMessage}"></p>
            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

            <form th:action="@{/projects/apply}" method="post" class="mt-4">
                <input type="hidden" name="projectId" th:value="${project.id}"/>
                <button type="submit" class="btn btn-success btn-lg px-5" th:if="${project.status == 'RECRUITING' and !applied}">
                    Đăng Ký Tham Gia
                </button>

                <button type="button" class="btn btn-info btn-lg px-5 text-white" disabled th:if="${project.status == 'RECRUITING' and applied}">
                    <i class="bi bi-check-circle me-2"></i>Bạn đã nộp đơn (Chờ duyệt)
                </button>

                <button type="button" class="btn btn-secondary btn-lg px-5" disabled th:if="${project.status != 'RECRUITING'}">
                    <i class="bi bi-lock-fill me-2"></i>Dự án chưa mở đăng ký
                </button>

                <a th:href="@{/projects/homepage}" class="btn btn-secondary btn-lg px-4 ms-2">Quay lại trang chủ</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
