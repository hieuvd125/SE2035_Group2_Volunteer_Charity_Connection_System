<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::body})}">
<head>
    <meta charset="UTF-8">
    <title>Duyệt dự án</title>
</head>
<body>
<section class="project-review-page">
    <div class="page-heading">
        <div>
            <p class="page-kicker">Admin</p>
            <h2>Duyệt dự án</h2>
            <p>Kiểm tra và xử lý các dự án đang chờ phê duyệt.</p>
        </div>
    </div>


<div class="page-alert success" th:if="${message}" th:text="${message}"></div>
<div class="page-alert error" th:if="${error}" th:text="${error}"></div>

<div class="project-table-card" th:if="${pendingProjects != null and not #lists.isEmpty(pendingProjects)}">
    <div class="table-responsive">
    <table class="project-list-table">
        <tr>
            <th>ID</th>
            <th>Tên chiến dịch</th>
            <th>Tổ chức</th>
            <th>Hành động</th>
        </tr>
        <tr th:each="p : ${pendingProjects}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.title}"></td>
            <td th:text="${p.organizer.fullName}"></td>
            <td>
                <div class="review-actions">
                <form th:action="@{/admin/projects/{id}/approve(id=${p.id})}" method="post">
                    <button type="submit">Phê duyệt</button>
                </form>
                <form th:action="@{/admin/projects/{id}/reject(id=${p.id})}" method="post">
                    <button class="reject-button" type="submit">Từ chối</button>
                </form>
                </div>
            </td>
        </tr>
    </table>
    </div>


    <div class="pagination" th:if="${reviewTotalPage > 1}" aria-label="Phân trang">
        <a th:if="${reviewCurrentPage > 0}"
           th:href="@{/admin/projects/review(pageNumber=${reviewCurrentPage - 1})}">Trước</a>
        <span th:if="${reviewCurrentPage == 0}">Trước</span>
        <a th:each="i : ${#numbers.sequence(0, reviewTotalPage - 1)}"
           th:href="@{/admin/projects/review(pageNumber=${i})}"
           th:text="${i + 1}"
           th:classappend="${i == reviewCurrentPage} ? 'active' : ''"></a>
        <a th:if="${reviewCurrentPage < reviewTotalPage - 1}"
           th:href="@{/admin/projects/review(pageNumber=${reviewCurrentPage + 1})}">Sau</a>
        <span th:if="${reviewCurrentPage >= reviewTotalPage - 1}">Sau</span>
        <span class="summary">Trang <b th:text="${reviewCurrentPage + 1}"></b>/<b th:text="${reviewTotalPage}"></b></span>
    </div>
</div>

<div class="empty-state" th:if="${pendingProjects == null or #lists.isEmpty(pendingProjects)}">
    <p>Không có dự án nào chờ duyệt.</p>
</div>
</section>
</body>
</html>
