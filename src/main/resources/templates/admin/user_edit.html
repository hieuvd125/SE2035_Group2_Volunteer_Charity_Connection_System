<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::body})}">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa tài khoản</title>
</head>
<body>

<div class="container">
    <p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold; background: #e8f8f5; padding: 10px; border-radius: 4px;"></p>

    <div class="card">
        <h2 class="card-title">Chỉnh sửa thông tin tài khoản</h2>

        <form th:action="@{/admin/users/edit/{id}(id=${user.id})}" th:object="${user}" method="POST">

            <div class="form-group">
                <label>Tên đăng nhập:</label>
                <input type="text" th:field="*{username}" readonly>
            </div>

            <div class="form-group">
                <label>Họ và Tên / Tên tổ chức:</label>
                <input type="text" th:field="*{fullName}" required>
            </div>

            <div class="form-group">
                <label>Email liên hệ:</label>
                <input type="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" th:field="*{phoneNumber}">
            </div>

            <div class="form-group">
                <label>Vai trò hệ thống:</label>
                <select th:field="*{role}" required>
                    <option value="VOLUNTEER">VOLUNTEER</option>
                    <option value="ORGANIZER">ORGANIZER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>

            <div class="form-group">
                <label>Trạng thái tài khoản:</label>
                <select th:field="*{status}" required>
                    <option value="ACTIVE">Hoạt động</option>
                    <option value="PENDING">Chờ duyệt</option>
                    <option value="BLOCKED">Đã khóa</option>
                </select>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-save">Lưu thay đổi</button>
                <a th:href="@{/admin/users}" class="btn btn-back">Hủy bỏ</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
