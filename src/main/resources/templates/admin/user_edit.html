<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::body})}">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa tài khoản</title>
</head>
<body>

<div class="container py-3">

    <div class="edit-card">
        <h2 class="card-title">Chỉnh sửa thông tin tài khoản</h2>

        <p th:if="${message}" th:text="${message}" class="alert-message"></p>

        <form th:action="@{/admin/users/edit/{id}(id=${user.id})}" th:object="${user}" method="POST">

            <div class="form-group">
                <label>Tên đăng nhập (chỉ đọc):</label>
                <input type="text" th:field="*{username}" readonly>
            </div>

            <div class="form-group">
                <label>Họ và Tên / Tên tổ chức <span style="color: #dc3545;">*</span>:</label>
                <input type="text" th:field="*{fullName}" required>
            </div>

            <div class="form-group">
                <label>Email liên hệ <span style="color: #dc3545;">*</span>:</label>
                <input type="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" th:field="*{phoneNumber}">
            </div>

            <div class="form-group">
                <label>Vai trò hệ thống <span style="color: #dc3545;">*</span>:</label>
                <select th:field="*{role}" required>
                    <option value="VOLUNTEER">Tình nguyện viên (VOLUNTEER)</option>
                    <option value="ORGANIZER">Tổ chức (ORGANIZER)</option>
                    <option value="ADMIN">Quản trị viên (ADMIN)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Trạng thái tài khoản <span style="color: #dc3545;">*</span>:</label>
                <select th:field="*{status}" required>
                    <option value="ACTIVE">Hoạt động</option>
                    <option value="PENDING">Chờ duyệt</option>
                    <option value="BLOCKED">Đã khóa</option>
                </select>
            </div>

            <div class="btn-group-custom">
                <button type="submit" class="btn-save">Lưu thay đổi</button>
                <a th:href="@{/admin/users}" class="btn-back">Hủy bỏ</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
