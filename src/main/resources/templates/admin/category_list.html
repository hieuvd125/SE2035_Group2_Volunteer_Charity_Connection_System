<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: page_layout(~{::title}, ~{::body})}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh mục Dự án</title>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <h2 style="color: #2c3e50; margin: 0;">Quản lý Danh mục Dự án</h2>
        <a th:href="@{/admin/categories/create}" class="btn-add">+ Thêm danh mục mới</a>
    </div>

    <p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold; background: #e8f8f5; padding: 10px; border-radius: 4px;"></p>

    <table>
        <thead>
        <tr>
            <th style="width: 80px;">ID</th>
            <th style="width: 250px;">Tên danh mục</th>
            <th>Mô tả</th>
            <th style="width: 150px;">Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cat : ${categories}">
            <td th:text="${cat.id}">1</td>
            <td><strong th:text="${cat.name}">Y tế & Sức khỏe</strong></td>
            <td th:text="${cat.description != null ? cat.description : 'Chưa có mô tả'}">Mô tả danh mục...</td>
            <td>
                <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" class="action-link btn-edit">Sửa</a>
                <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}"
                   class="action-link btn-delete"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');">Xóa</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categories)}">
            <td colspan="4" style="text-align: center; color: #7f8c8d;">Chưa có danh mục nào trong hệ thống!</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
